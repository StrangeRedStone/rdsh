name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-help:
    name: 语法检查 + --help 冒烟 + 可移植性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n（全部脚本）
        run: |
          set -e
          for f in *.sh tools/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: --help 冒烟（每个脚本都应在干净 HOME 下 0 退出并打出用法）
        run: |
          set -e
          for f in *.sh tools/*.sh; do
            out="$(HOME="$(mktemp -d)" bash "$f" --help 2>&1)" || { echo "FAIL $f --help"; printf '%s\n' "$out"; exit 1; }
            [ -n "$out" ] || { echo "FAIL $f: --help 输出为空"; exit 1; }
            echo "ok  $f --help"
          done

      - name: 可移植性冒烟（未配置时 MANAGE_ROOT 应回退到脚本自身目录）
        run: |
          set -e
          tmp="$(mktemp -d)"
          out="$(HOME="$tmp" bash ./Rdsh.sh list 2>&1 || true)"
          echo "--- Rdsh.sh list 输出 ---"
          echo "$out"
          echo "--- 当前目录：$(pwd) ---"
          echo "$out" | grep -qF "$(pwd)" || {
            echo "FAIL：MANAGE_ROOT 没有回退到脚本自身目录 —— clone 到任意目录后将不可用"
            exit 1
          }
          echo "ok  可移植性回退生效"

  shellcheck:
    name: shellcheck（咨询性，恒成功）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck（结果仅供参考，不影响 CI 结论）
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          shellcheck -S warning *.sh || true
          echo "（以上为咨询性结果；本作业恒成功）"
