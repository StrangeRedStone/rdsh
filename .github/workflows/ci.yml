name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-help:
    name: 语法检查 + --help 冒烟 + 可移植性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n（全部脚本）
        run: |
          set -e
          for f in *.sh tools/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: --help 冒烟（每个脚本都应在干净 HOME 下 0 退出并打出用法）
        run: |
          set -e
          for f in *.sh tools/*.sh; do
            out="$(HOME="$(mktemp -d)" bash "$f" --help 2>&1)" || { echo "FAIL $f --help"; printf '%s\n' "$out"; exit 1; }
            [ -n "$out" ] || { echo "FAIL $f: --help 输出为空"; exit 1; }
            echo "ok  $f --help"
          done

      - name: 可移植性冒烟（未配置时 MANAGE_ROOT 应回退到脚本自身目录）
        run: |
          set -e
          tmp="$(mktemp -d)"
          out="$(HOME="$tmp" bash ./Rdsh.sh list 2>&1 || true)"
          echo "--- Rdsh.sh list 输出 ---"
          echo "$out"
          echo "--- 当前目录：$(pwd) ---"
          echo "$out" | grep -qF "$(pwd)" || {
            echo "FAIL：MANAGE_ROOT 没有回退到脚本自身目录 —— clone 到任意目录后将不可用"
            exit 1
          }
          echo "ok  可移植性回退生效"

  shellcheck:
    name: shellcheck（error 级阻塞，warning 级咨询）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: error 级（阻塞）
        run: |
          set -e
          shellcheck -S error -f gcc *.sh tools/*.sh
          echo "ok  error 级 0 条"

      - name: warning 级（咨询，不阻塞）
        run: |
          n=$(shellcheck -S warning -f gcc *.sh tools/*.sh 2>/dev/null | grep -c ":" || true)
          echo "warning 级 $n 条（不阻塞）。已知误报族：SC2128/SC2178=同名变量各 local；SC1111=中文引号；SC2088=case 模式；SC2209=mode=赋值"
          shellcheck -S warning -f gcc *.sh tools/*.sh || true
