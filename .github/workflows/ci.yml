name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-help:
    name: 语法检查 + --help 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n（全部脚本）
        run: |
          set -e
          for f in *.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: --help 冒烟（每个脚本都应 0 退出并打出用法）
        run: |
          set -e
          for f in *.sh; do
            out="$(bash "$f" --help 2>&1)" || { echo "FAIL $f --help"; echo "$out"; exit 1; }
            [ -n "$out" ] || { echo "FAIL $f: --help 输出为空"; exit 1; }
            echo "ok  $f --help"
          done

  shellcheck:
    name: shellcheck（咨询性，不阻塞）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
