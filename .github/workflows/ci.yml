name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-help:
    name: 语法检查 + --help 冒烟 + 可移植性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n（全部脚本）
        run: |
          set -e
          for f in *.sh tools/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: --help 冒烟（每个脚本都应在干净 HOME 下 0 退出并打出用法）
        run: |
          set -e
          for f in *.sh tools/*.sh; do
            out="$(HOME="$(mktemp -d)" bash "$f" --help 2>&1)" || { echo "FAIL $f --help"; printf '%s\n' "$out"; exit 1; }
            [ -n "$out" ] || { echo "FAIL $f: --help 输出为空"; exit 1; }
            echo "ok  $f --help"
          done

      - name: 可移植性冒烟（未配置时 MANAGE_ROOT 应回退到脚本自身目录）
        run: |
          set -e
          tmp="$(mktemp -d)"
          out="$(HOME="$tmp" bash ./Rdsh.sh list 2>&1 || true)"
          echo "--- Rdsh.sh list 输出 ---"
          echo "$out"
          echo "--- 当前目录：$(pwd) ---"
          echo "$out" | grep -qF "$(pwd)" || {
            echo "FAIL：MANAGE_ROOT 没有回退到脚本自身目录 —— clone 到任意目录后将不可用"
            exit 1
          }
          echo "ok  可移植性回退生效"

      - name: 功能冒烟（隔离 BASE：state 状态账本）
        run: |
          set -e
          bash tools/smoke-state.sh ./Rdsh.sh

      # 本地等价（推之前请跑一遍，2026-09-30 CI 就是在这儿翻的车）：
      #   for f in tools/smoke-*.sh; do HOME="$(mktemp -d)" bash "$f" ./Rdsh.sh; done
      # 干净 HOME 能暴露"夹具偷偷依赖真机状态"：入口链维、真机 restart/PID 断言、真机备份根路径…
      - name: 功能冒烟（隔离 BASE：doctor 只读体检）
        run: |
          set -e
          bash tools/smoke-doctor.sh ./doctor.sh

      - name: 功能冒烟（隔离 BASE：du 账本 + trash 回收站）
        run: |
          set -e
          bash tools/smoke-du.sh ./Rdsh.sh

      - name: 功能冒烟（隔离 BASE：backup 增量快照 + restore）
        run: |
          set -e
          bash tools/smoke-backup-restore.sh ./Rdsh.sh

      - name: 功能冒烟（蛋生鸡：bootstrap + selfupdate）
        run: |
          set -e
          bash tools/smoke-bootstrap.sh .

      - name: 功能冒烟（隔离 BASE：改名重绑与命名规范化）
        run: |
          set -e
          bash tools/smoke-rename.sh ./Rdsh.sh

      - name: 功能冒烟（入口链自检）
        run: |
          set -e
          bash tools/smoke-entry.sh ./doctor.sh

      - name: 功能冒烟（门面契约）
        run: |
          set -e
          bash tools/smoke-bridge.sh ./Rdsh.sh

      - name: 功能冒烟（隔离 BASE：settings 携带与登记）
        run: |
          set -e
          bash tools/smoke-settings.sh ./Rdsh.sh

      - name: 功能冒烟（隔离 BASE：同版本共存编号）
        run: |
          set -e
          bash tools/smoke-numbering.sh ./Rdsh.sh

      - name: 功能冒烟（隔离 BASE：retire 退役五类足迹）
        run: |
          set -e
          bash tools/smoke-retire.sh ./Rdsh.sh

      - name: 功能冒烟（隐私守卫规则）
        run: |
          set -e
          bash tools/smoke-scan.sh ./scan-secrets.sh

  privacy-scan:
    name: 隐私守卫（扫仓库里的私钥/令牌/凭据/会话数据）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描（error 级阻塞，warn 级咨询）
        run: |
          # 注意：GitHub 的 run: 默认是 `bash -e`，而守卫"只有 warn"时退 1 ——
          # 必须显式容忍 rc=1，否则 warn 会把 CI 误判为失败（与"warn 咨询"的定位矛盾）
          set +e
          bash scan-secrets.sh --path . --quiet
          rc=$?
          set -e
          echo "隐私守卫退出码：$rc（0 干净 / 1 有 warn / 2 有 error）"
          if [ "$rc" = 2 ]; then echo "公开仓不能这样发：先清掉 error 级命中项"; exit 1; fi
          echo "ok  无 error（warn 级见上）"

  shellcheck:
    name: shellcheck（error 级阻塞，warning 级咨询）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: error 级（阻塞）
        run: |
          set -e
          shellcheck -S error -f gcc *.sh tools/*.sh
          echo "ok  error 级 0 条"

      - name: warning 级（咨询，不阻塞）
        run: |
          n=$(shellcheck -S warning -f gcc *.sh tools/*.sh 2>/dev/null | grep -c ":" || true)
          echo "warning 级 $n 条（不阻塞）。已知误报族：SC2128/SC2178=同名变量各 local；SC1111=中文引号；SC2088=case 模式；SC2209=mode=赋值"
          shellcheck -S warning -f gcc *.sh tools/*.sh || true
